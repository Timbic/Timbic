      <circle cx="380" cy="560" r="1.2" opacity="0.35"><animate attributeName="cy" values="560;545;560" dur="5.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.15;0.5;0.15" dur="5.5s" repeatCount="indefinite"/></circle>
