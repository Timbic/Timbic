      <stop offset="60%" stop-color="#7A0BC0" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#7A0BC0" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="cardClip"><rect width="1180" height="610" rx="26"/></clipPath>
    <clipPath id="rightPanelClip"><rect x="720" y="116" width="420" height="454" rx="18"/></clipPath>
  </defs>

